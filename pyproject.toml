[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prc2026"
version = "0.1.0"
description = "Taxi-out time prediction for the PRC Data Challenge 2026"
requires-python = ">=3.10"
# GPLv3 is mandated by the challenge prize-eligibility rules
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "pandas>=2.1",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "minio>=7.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0", "jupyterlab>=4.0", "matplotlib>=3.8"]

[project.scripts]
prc2026 = "prc2026.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
